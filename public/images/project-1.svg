<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="field1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="warm1" cx="72%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#f4633a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f4633a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#field1)"/>
  <rect width="1200" height="900" fill="url(#warm1)"/>

  <!-- Hairline grid, echoing GridBackground -->
  <g stroke="#ebe8e3" stroke-opacity="0.06" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="675" x2="1200" y2="675"/>
  </g>

  
  <g fill="none" stroke="#f4633a" stroke-width="2">
    <circle cx="760" cy="430" r="120" stroke-opacity="0.90"/>
    <circle cx="760" cy="430" r="220" stroke-opacity="0.70"/>
    <circle cx="760" cy="430" r="320" stroke-opacity="0.50"/>
    <circle cx="760" cy="430" r="420" stroke-opacity="0.30"/>
  </g>
  <g stroke="#ebe8e3" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="180" y1="700" x2="1020" y2="700"/>
    <line x1="180" y1="700" x2="180" y2="620"/>
    <line x1="1020" y1="700" x2="1020" y2="620"/>
  </g>
  <rect x="180" y="180" width="180" height="180" fill="#f4633a" fill-opacity="0.9"/>

</svg>
