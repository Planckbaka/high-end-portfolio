<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="field3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="warm3" cx="72%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#f4633a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f4633a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#field3)"/>
  <rect width="1200" height="900" fill="url(#warm3)"/>

  <!-- Hairline grid, echoing GridBackground -->
  <g stroke="#ebe8e3" stroke-opacity="0.06" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="675" x2="1200" y2="675"/>
  </g>

  
  <g transform="translate(600 450)">
    <rect x="-230" y="-230" width="460" height="460" transform="rotate(0)" fill="none" stroke="#f4633a" stroke-opacity="0.85" stroke-width="2"/>
    <rect x="-188" y="-188" width="376" height="376" transform="rotate(12)" fill="none" stroke="#ebe8e3" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="-146" y="-146" width="292" height="292" transform="rotate(24)" fill="none" stroke="#ebe8e3" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="-104" y="-104" width="208" height="208" transform="rotate(36)" fill="none" stroke="#f4633a" stroke-opacity="0.85" stroke-width="2"/>
    <rect x="-62" y="-62" width="124" height="124" transform="rotate(48)" fill="none" stroke="#ebe8e3" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="-28" y="-28" width="56" height="56" fill="#f4633a"/>
  </g>

</svg>
