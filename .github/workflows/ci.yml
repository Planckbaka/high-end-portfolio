name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Generate article data
        run: npm run generate:articles

      - name: Run tests
        run: npm run test

      - name: Check TypeScript and content pipeline
        run: |
          npx tsc --noEmit --incremental false
          npm run test:content
          npm run check:content

      - name: Build Worker and verify publication
        run: |
          npm run build:cf
          node scripts/check-publication.mjs
          npx wrangler deploy --dry-run --env ''
          node scripts/check-worker.mjs

  labs:
    name: Reproduce engineering labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Go lifecycle and race conditions
        working-directory: labs/go
        run: go test -race ./...
      - name: Install CPU experiment dependencies
        run: |
          python -m venv labs/.venv
          labs/.venv/bin/python -m pip install -r labs/requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Test Python orchestration and tensor correctness
        run: |
          labs/.venv/bin/python -m unittest discover -s labs/python/concurrency -p 'test_*.py' -v
          labs/.venv/bin/python -m unittest discover -s labs/python/streaming -p 'test_*.py' -v
          labs/.venv/bin/python -m unittest discover -s labs/llm/attention -p 'test_*.py' -v
          labs/.venv/bin/python -m unittest discover -s labs/llm/kv-cache -p 'test_*.py' -v
